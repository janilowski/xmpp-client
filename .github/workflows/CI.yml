name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests and static checks
        run: |
          bun run test:unit
          bun run lint
          bun run typecheck

      - name: Build and check bundle size
        run: |
          bun run build
          bun run bundlesize

      - name: Install Prosody
        run: |
          sudo wget \
            "https://prosody.im/downloads/repos/$(lsb_release -sc)/prosody.sources" \
            -O /etc/apt/sources.list.d/prosody.sources

          sudo apt-get update

          # luarocks pulls in Lua 5.1, so install it before Prosody.
          sudo apt-get install --yes \
            lua5.4 \
            liblua5.4-dev \
            lua-bitop \
            lua-sec \
            luarocks

          # Prosody 13 requires Lua 5.2+; use Lua 5.4.
          sudo update-alternatives --set lua-interpreter /usr/bin/lua5.4
          sudo update-alternatives --set lua-compiler /usr/bin/luac5.4

          # Now Prosody's post-install service start uses Lua 5.4.
          sudo apt-get install --yes prosody
          sudo systemctl stop prosody

          lua -v

      - name: Install Prosody test modules and start server
        run: |
          bun run prosody:setup
          bun run server:start

      - name: Integration tests
        run: |
          bun run test:e2e
          bun run test:browser

      - name: Pack main-branch artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          bun pm pack --filename "artifacts/xmpp-client-${GITHUB_SHA}.tgz"

      - name: Upload main-branch artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: xmpp-client-${{ github.sha }}
          path: artifacts/xmpp-client-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Show Prosody errors
        if: failure()
        run: test ! -f server/prosody.err || cat server/prosody.err

      - name: Stop test server
        if: always()
        run: bun run server:stop
